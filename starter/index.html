<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Sales Report</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 40px 15px;
        }

        figure {
            max-width: 650px;
            margin: 0 auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        figcaption {
            font-size: 180%;
            font-weight: bold;
            text-align: center;
            color: #17365d;
            padding-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px auto;
        }

        thead {
            background-color: #17365d;
            color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #d5deea;
            text-align: right;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        tbody td:nth-child(2) {
            text-align: center;
        }

        tbody tr:nth-child(even) {
            background-color: #edf4fc;
        }

        tbody tr:hover {
            background-color: #d9eaff;
        }

        tfoot {
            background-color: #d1e7dd;
            color: #155724;
            font-weight: bold;
        }

        @media screen and (max-width: 600px) {
            figure {
                padding: 10px;
                overflow-x: auto;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 8px 5px;
            }

            figcaption {
                font-size: 145%;
            }
        }
    </style>
</head>

<body>

    <figure>
        <figcaption>Book Sales Summary</figcaption>

        <table>
            <thead>
                <tr>
                    <th>Book Title</th>
                    <th>Publication Year</th>
                    <th>Total Sales</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>PHP and MySQL</td>
                    <td>2014</td>
                    <td>$372,381</td>
                </tr>

                <tr>
                    <td>JavaScript and jQuery</td>
                    <td>2015</td>
                    <td>$305,447</td>
                </tr>

                <tr>
                    <td>Java Programming</td>
                    <td>2011</td>
                    <td>$392,444</td>
                </tr>

                <tr>
                    <td>Java Servlets and JSP</td>
                    <td>2014</td>
                    <td>$328,992</td>
                </tr>

                <tr>
                    <td>ASP.NET with Visual Basic</td>
                    <td>2011</td>
                    <td>$351,200</td>
                </tr>

                <tr>
                    <td>ASP.NET with C#</td>
                    <td>2011</td>
                    <td>$404,332</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <th colspan="2">Total Sales</th>
                    <td>$2,154,786</td>
                </tr>
            </tfoot>
        </table>
    </figure>

</body>
</html>
